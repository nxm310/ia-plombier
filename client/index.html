<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23059669'><path d='M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#059669" />
    <link rel="manifest" href="./manifest.json" />
    <title>Hub PME : Agenda & CRM</title>
    <meta property="og:title" content="Confirmation de Rendez-vous • Hub PME" />
    <meta property="og:description" content="Cliquez ici pour synchroniser votre intervention avec Apple Calendrier ou Google Agenda." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nxm310.github.io/ia-plombier/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body class="h-full text-slate-900 font-['Plus_Jakarta_Sans',sans-serif] antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            reg.update().catch(() => {});
          }).catch((err) => {
            console.log('SW registration failed:', err);
          });
        });
      }

      // Sécurité anti-page blanche : si un chunk manquant échoue (mise à jour en cours)
      window.addEventListener('error', (e) => {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('[Auto-Recovery] Erreur de chargement d\'asset. Nettoyage du cache...');
          if ('caches' in window) {
            caches.keys().then((keys) => Promise.all(keys.map(k => caches.delete(k)))).then(() => {
              window.location.reload();
            });
          }
        }
      }, true);

      // Si après 3s l'application n'est pas montée, purger les anciens caches et recharger
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.children.length === 0) {
          console.warn('[Auto-Recovery] Détection d\'écran blanc persistant. Nettoyage et rafraîchissement...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
              regs.forEach((r) => r.unregister());
            });
          }
          if ('caches' in window) {
            caches.keys().then((keys) => Promise.all(keys.map(k => caches.delete(k)))).then(() => {
              window.location.reload();
            });
          }
        }
      }, 3000);
    </script>
  </body>
</html>
